server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Types MIME : la table standard est incluse, puis le manifeste de
    # l'application web progressive y ajoute son propre type. Sans cet
    # include, la page d'accueil serait servie en octet-stream et le
    # navigateur la telechargerait au lieu de l'afficher.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json  webmanifest;
    }

    # Compression des fichiers texte et des ressources statiques.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité servis par l'interface.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Relais des appels vers l'interface de programmation : le prefixe /api
    # est identique a celui utilise par le relais de Vite en developpement.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service des fichiers compilés par Vite.
    # Relais du canal temps reel (Socket.IO) vers le serveur : sans ce
    # relais, les evenements ne parviennent pas au navigateur et l'ecran
    # ne se met a jour que par rechargement manuel.
    location /socket.io/ {
        proxy_pass http://server:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service du worker de l'application web progressive.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # La page d'accueil n'est jamais mise en cache : c'est elle qui
    # reference le bundle courant, et un cache heritee ferait servir une
    # version ancienne de l'interface apres un deploiement.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Repli sur l'index : toute route de l'application monopage est geree
    # par le routeur cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
