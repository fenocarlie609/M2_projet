$kind: http-request
name: 'Update user by id'
method: PUT
url: '{{base_url}}/users/:id'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{bearer_token}}'
pathVariables:
  - key: id
    value: 'user-id-here'
body:
  type: json
  content: |-
    {
      "email": "updated@example.com",
      "name": "Updated Name",
      "role": "ADMIN"
    }
