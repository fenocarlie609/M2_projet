# Déploiement de l'application de gestion logistique et de fret maritime.
# Trois services : la base de donnees, l'interface de programmation et
# l'interface web. Un service de migration prepare la base avant le demarrage
# du serveur.
#
#   docker compose up --build
#   interface web      : http://localhost:8080
#   interface de prog. : http://localhost:5000/api/v1/health
#
# Le service « seed » applique les migrations puis installe les donnees de
# reference : structure de l'entreprise, catalogue des modules de permissions
# et administrateur universel. Ce dernier permet de creer ensuite les comptes
# des utilisateurs depuis l'interface.
#
#   identifiant  : admin@lct.mg        (variable ADMIN_EMAIL)
#   mot de passe : Admin@2026         (variable ADMIN_PASSWORD)

services:
  db:
    image: postgres:16-alpine
    container_name: gestion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion}
      POSTGRES_DB: ${POSTGRES_DB:-gestion}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion} -d ${POSTGRES_DB:-gestion}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gestion

  # Socle minimal : migrations, structure de l'entreprise, catalogue des
  # modules de permissions et compte administrateur universel.
  seed:
    build:
      context: ./server
      target: build
    container_name: gestion-seed
    command: >
      sh -c "npx prisma migrate deploy &&
             node prisma/seeds/index.js --base"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestion}:${POSTGRES_PASSWORD:-gestion}@db:5432/${POSTGRES_DB:-gestion}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur Système}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lct.mg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - gestion

  # Jeu de donnees de demonstration complet : dix-huit mois d'exploitation.
  # Usage : docker compose --profile demo run --rm seed-demo
  seed-demo:
    build:
      context: ./server
      target: build
    container_name: gestion-seed-demo
    command: node prisma/seeds/index.js
    profiles:
      - demo
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestion}:${POSTGRES_PASSWORD:-gestion}@db:5432/${POSTGRES_DB:-gestion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lct.mg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - gestion

  server:
    build:
      context: ./server
    container_name: gestion-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestion}:${POSTGRES_PASSWORD:-gestion}@db:5432/${POSTGRES_DB:-gestion}
      COOKIE_SECRET: ${COOKIE_SECRET:-a-remplacer-en-production}
      JWT_SECRET: ${JWT_SECRET:-a-remplacer-en-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-a-remplacer-en-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Limiteur global de l'interface de programmation : 600 requetes par
      # quart d'heure et par adresse, valeur reglagee pour que la
      # consultation des ecrans (plusieurs appels par page) ne soit jamais
      # interrompue. Le forcage brutal reste couvert par le limiteur de
      # connexion.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "${SERVER_PORT:-5000}:5000"
    volumes:
      - fichiers-televerses:/app/public/uploads
    networks:
      - gestion

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api/v1
    container_name: gestion-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8080}:80"
    networks:
      - gestion

volumes:
  donnees-postgres:
  fichiers-televerses:

networks:
  gestion:
    driver: bridge
